spring.application.name=todo-app
server.port=8080

# File-based H2 so todos survive restarts. Use jdbc:h2:mem:tododb for in-memory.
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/tododb)
spring.h2.console.enabled=true


# Health endpoints used by Kubernetes probes:
#   /actuator/health/liveness  and  /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true