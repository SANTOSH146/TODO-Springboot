# Activate with: mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"
# The database "tododb" is created automatically if it doesn't exist.
# Set DB_USERNAME / DB_PASSWORD environment variables, or edit the defaults below.
spring.datasource.url=jdbc:mysql://localhost:3306/tododb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
