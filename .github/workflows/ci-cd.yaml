name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  test:
    name: Test & build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package jar
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

  docker:
    name: Build & push image
    needs: test               # only runs if tests pass
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}     # used by the deploy step later
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PRs build only, no push
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/todo-app:${{ steps.tag.outputs.tag }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/todo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max