apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  labels: { app: todo-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: todo-app }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # zero-downtime: keep old pods until new ones are ready
      maxSurge: 1
  template:
    metadata:
      labels: { app: todo-app }
    spec:
      initContainers:
        # Wait for MySQL to accept connections before starting the app
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: todo-app
          image: todo-app        # replaced with the Docker Hub image by kustomization.yaml
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: DB_HOST
              value: mysql
            - name: DB_NAME
              value: tododb
            - name: DB_USERNAME
              value: todo
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36     # allow up to 3 minutes to start
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  labels: { app: todo-app }
spec:
  type: LoadBalancer
  selector: { app: todo-app }
  ports:
    - name: http
      port: 8090
      targetPort: http